<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
  <link rel="stylesheet" href="payment.css">
</head>

<body>

  <div class="payment-page">

    <div class="payment-card">

      <h1>Complete Payment</h1>

      <p class="sub">
        Pay ₹249 using UPI
      </p>

      <div class="amount">₹249</div>

      <div class="upi-title">UPI ID</div>

      <div class="upi-box">
        <span id="upiId">fftopupsite@axl</span>
        <button id="copyBtn">COPY</button>
      </div>

      <div class="qr-box">
        <img src="upi-qr.png.jpeg" alt="UPI QR">
      </div>

      <p class="scan-text">
        Scan QR code with any UPI app
      </p>

      <button class="paid-btn" id="paidBtn">
        I HAVE PAID
      </button>

      <div class="utr-section hidden" id="utrSection">

        <h2>Enter UTR Number</h2>

        <p>
          Enter your UPI transaction / UTR number
        </p>

        <input
          type="text"
          id="utrInput"
          placeholder="Enter UTR number"
        >

        <button class="submit-btn" id="submitBtn">
          SUBMIT
        </button>

        <div class="error hidden" id="error">
          Please enter a valid UTR number.
        </div>

      </div>

      <div class="success hidden" id="success">

        <div class="success-icon">✓</div>

        <h2>Payment Submitted</h2>

        <p>
          Your payment details have been submitted successfully.
        </p>

      </div>

      <a href="index.html" class="back">
        ← Back
      </a>

    </div>

  </div>

  <script src="payment.js"></script>

</body>
</html>
