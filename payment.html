<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Complete Payment</title>

  <link rel="stylesheet" href="payment.css">
</head>

<body>

  <div class="payment-page">

    <div class="payment-card">

      <div class="top-icon">💳</div>

      <h1>Complete Payment</h1>

      <p class="subtitle">
        Pay ₹249 using UPI
      </p>

      <div class="amount">
        ₹249
      </div>

      <div class="upi-label">
        UPI ID
      </div>

      <div class="upi-box">

        <span id="upiId">
          fftopupsite@axl
        </span>

        <button id="copyBtn">
          COPY
        </button>

      </div>

      <div class="qr-title">
        Scan & Pay
      </div>

      <div class="qr-box">

        <img
          src="upi-qr.png.jpeg"
          alt="UPI QR Code">

      </div>

      <p class="scan-text">
        Scan the QR code using any UPI app
      </p>

      <button
        class="paid-btn"
        id="paidBtn">

        I HAVE PAID
        <span>→</span>

      </button>

      <div
        class="payment-error"
        id="paymentError">

        ❌ Please complete payment first.

      </div>

      <a href="index.html" class="back-btn">
        ← Back to Course
      </a>

    </div>

  </div>

  <script src="payment.js"></script>

</body>
</html>
